spring.application.name=BasketHub

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/baskethub}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=${PORT:6545}

jwt.secret=${JWT_SECRET:baskethub-local-dev-secret-change-in-production-1234567890}
jwt.expiration-ms=86400000

groq.api-key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:openai/gpt-oss-120b}