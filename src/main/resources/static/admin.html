<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BasketHub Admin</title>
  <style>
    body{font-family:'DM Sans',Arial,sans-serif;margin:0;background:#faf7f2;color:#111}
    header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;background:#111;color:#fff}
    header a{color:#fff;text-decoration:none;font-weight:600}
    main{max-width:960px;margin:20px auto;padding:0 16px}
    .card{background:#fff;border-radius:14px;padding:16px;margin-bottom:20px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
    h2{margin:0 0 12px}
    form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    form .full{grid-column:1 / -1}
    label{font-size:13px;font-weight:600;display:block;margin-bottom:4px}
    input,textarea{width:100%;box-sizing:border-box;padding:9px 10px;border:1px solid #ddd;border-radius:8px;font:inherit}
    button{border:0;border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer;background:#111;color:#fff}
    button.light{background:#eee;color:#111}
    button.danger{background:#c0392b}
    table{width:100%;border-collapse:collapse;font-size:14px}
    th,td{text-align:left;padding:8px;border-bottom:1px solid #eee;vertical-align:middle}
    td img{width:48px;height:48px;object-fit:cover;border-radius:6px}
    #msg{padding:10px 12px;border-radius:8px;margin-bottom:14px;display:none}
    .ok{background:#e6f6ea;color:#1c6b32}.err{background:#fdecea;color:#a12622}
    .hint{font-size:12px;color:#666;margin-top:3px}
    @media(max-width:640px){form{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header><strong>BasketHub Admin</strong><a href="index.html">← Back to shop</a></header>
  <main>
    <div id="msg"></div>

    <div class="card">
      <h2 id="formTitle">Add a product</h2>
      <form id="productForm">
        <input type="hidden" id="pid">
        <div><label for="name">Name</label><input id="name" required maxlength="120"></div>
        <div><label for="category">Category</label><input id="category" placeholder="Electronics, Fashion, Home, Books, Sports" maxlength="60"></div>
        <div><label for="price">Price (₹)</label><input id="price" type="number" step="0.01" min="0.01" required></div>
        <div><label for="stock">Stock</label><input id="stock" type="number" min="0" step="1" required></div>
        <div class="full"><label for="imageUrl">Image URL</label><input id="imageUrl" placeholder="/images/earbuds.jpg  or  https://..." maxlength="500">
          <div class="hint">Use /images/yourfile.jpg for a file you added to the project, or a direct image link. Leave empty for the default picture.</div></div>
        <div class="full"><label for="description">Description</label><textarea id="description" rows="3" maxlength="1000"></textarea></div>
        <div class="full"><button type="submit" id="saveBtn">Save product</button>
          <button type="button" class="light" id="cancelBtn" style="display:none">Cancel edit</button></div>
      </form>
    </div>

    <div class="card">
      <h2>All products</h2>
      <div style="overflow-x:auto">
        <table>
          <thead><tr><th></th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th></th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </main>
  <script src="js/common.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
